name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  browser-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
      - run: npm run examples

  mod-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Compile and test standalone C# chart/library/score core
        shell: pwsh
        run: ./mods/ChartRecorder/tests/run-core.ps1
